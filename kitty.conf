# Font/General
term xterm-256color
font_family      Ioskeley Mono 
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10

# Nerd Font fallback for icons
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Iosevka Nerd Font Propo

# Cursor
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0

# Tabs Styling. Powerline_style options: slanted/round/angled
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_align left
inactive_tab_font_style normal
active_tab_title_template "󰄛 {index} : {title} 󰖲 [{num_windows}]"

# Windows(panes)
enabled_layouts splits:split_axis=horizontal
map ctrl+shift+enter launch --location=split
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Tabs keybinds
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
# Direct tab selection
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# Appearance
background_opacity 0.95
dynamic_background_opacity yes
window_padding_width 2
hide_window_decorations yes

